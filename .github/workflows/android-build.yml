name: Build Lumora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract Lumora project
        shell: bash
        run: |
          echo "Extracting Lumora project..."

          mkdir -p lumora-source

          unzip -o Lumora_Auto_Enhancer_CoGo_V0.1.zip -d lumora-source

          echo "Extracted files:"
          find lumora-source -maxdepth 4 -type f | sort

      - name: Find Gradle project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find lumora-source \
            -name "settings.gradle.kts" \
            -type f \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find lumora-source \
              -name "settings.gradle" \
              -type f \
              -not -path "*/.gradle/*" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project files
        run: |
          echo "Project directory: $PROJECT_DIR"
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Auto-Enhancer-APK
          path: "lumora-source/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
